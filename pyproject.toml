[project]
name = "day01-sales-analytics-command-center"
version = "2.0.0"
description = "A portfolio-grade commercial analytics product with a reproducible data pipeline."
requires-python = ">=3.11"
dependencies = ["pandas==2.2.3", "numpy==2.2.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py311"
exclude = ["public"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = false
files = ["src"]
